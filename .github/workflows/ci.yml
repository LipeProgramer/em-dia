name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api-build-test:
    name: API — Build, testes unitários e de integração
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testes unitários (Domain) com cobertura
        run: >
          dotnet test tests/EmDia.Domain.Tests
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=domain-tests.trx"
          --results-directory ./TestResults

      # Testcontainers sobe um PostgreSQL descartável (o runner do GitHub já tem Docker)
      - name: Testes de integração (API + PostgreSQL)
        run: >
          dotnet test tests/EmDia.Api.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./TestResults

      - name: Upload resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: api/TestResults/

  frontend-build-test:
    name: Frontend — Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes (Vitest)
        run: npx vitest run --reporter=verbose

  mobile-check:
    name: App mobile — Tipos, testes e Expo Doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Testes (Vitest)
        run: npx vitest run

      - name: Dependências compatíveis com o SDK
        run: npx expo-doctor
