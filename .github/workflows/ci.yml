name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api-build-test:
    name: API — Build & Testes Unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependências
        run: dotnet restore

      - name: Build (sem warnings relevantes)
        run: dotnet build --no-restore --configuration Release

      - name: Testes unitários (Domain)
        run: >
          dotnet test tests/EmDia.Domain.Tests
          --no-build --configuration Release
          --logger "trx;LogFileName=domain-tests.trx"
          --results-directory ./TestResults

      - name: Upload resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: api/TestResults/

  frontend-build-test:
    name: Frontend — Build & Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes (Vitest)
        run: npm test -- --reporter=verbose --run
