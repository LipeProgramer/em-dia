services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: emdia
      POSTGRES_PASSWORD: emdia_dev
      POSTGRES_DB: emdia
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
