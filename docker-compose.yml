# PostgreSQL local para desenvolvimento (porta 5433 para não conflitar com um PostgreSQL já instalado).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: emdia
      POSTGRES_PASSWORD: emdia_dev
      POSTGRES_DB: emdia
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
