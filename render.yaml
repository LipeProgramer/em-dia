# Blueprint do Render: sobe a API (Docker) no plano gratuito. Passo a passo em docs/deploy.md.
services:
  - type: web
    name: emdia-api-felipemsantoss
    runtime: docker
    plan: free
    region: virginia
    # Caminhos contados a partir da raiz do repositório
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      # Connection string do Neon no formato Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false
      # Endereço do site no Vercel, ex.: https://em-dia.vercel.app
      - key: Cors__Origens__0
        sync: false
      # Chave do JWT gerada pelo Render (256 bits); nunca vai para o repositório
      - key: Jwt__Key
        generateValue: true
      - key: Proxy__Confiar
        value: "true"
      - key: Database__MigrarAoIniciar
        value: "true"
      # Endereço do site usado no link de "Esqueci minha senha" (DV24); sem ele, usa Cors__Origens__0
      - key: Site__Url
        value: https://em-dia-projeto-facul.vercel.app
